name: Build ZuLive Android APK

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
      - zulive-premium-home-build
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Output artifact type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both
      split_per_abi:
        description: 'Build separate smaller APKs per CPU (arm64 + armv7)'
        required: false
        default: true
        type: boolean
      api_base_url:
        description: 'Override API Base URL (e.g. https://your-app.up.railway.app/api/)'
        required: false
        default: ''
        type: string
      api_token:
        description: 'Override API Token (matches Railway API_TOKEN)'
        required: false
        default: ''
        type: string

jobs:
  build-android:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (3.41.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
              "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
            echo "Release keystore configured from GitHub Secrets."
          else
            rm -f android/key.properties
            echo "No ANDROID_KEYSTORE_BASE64 secret found; using debug signing fallback for release build."
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify Dart compilation (flutter analyze)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK / App Bundle
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          INPUT_TOKEN: ${{ github.event.inputs.api_token }}
          VAR_URL: ${{ vars.API_BASE_URL }}
          VAR_TOKEN: ${{ vars.API_TOKEN }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'apk' }}
          SPLIT_ABI: ${{ github.event.inputs.split_per_abi }}
        run: |
          DART_DEFINES=()
          FINAL_URL="${INPUT_URL:-$VAR_URL}"
          FINAL_TOKEN="${INPUT_TOKEN:-$VAR_TOKEN}"

          if [ -n "$FINAL_URL" ]; then
            DART_DEFINES+=("--dart-define=API_BASE_URL=$FINAL_URL")
          fi
          if [ -n "$FINAL_TOKEN" ]; then
            DART_DEFINES+=("--dart-define=API_TOKEN=$FINAL_TOKEN")
          fi

          mkdir -p build/app/outputs/release-artifacts

          if [ "$BUILD_TYPE" = "apk" ] || [ "$BUILD_TYPE" = "both" ]; then
            if [ "$SPLIT_ABI" != "false" ]; then
              flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm "${DART_DEFINES[@]}"
              cp -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/release-artifacts/ZuLive-arm64-v8a.apk
              cp -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/release-artifacts/ZuLive-armeabi-v7a.apk
            else
              flutter build apk --release "${DART_DEFINES[@]}"
              cp -f build/app/outputs/flutter-apk/app-release.apk build/app/outputs/release-artifacts/ZuLive-universal.apk
            fi
          fi

          if [ "$BUILD_TYPE" = "appbundle" ] || [ "$BUILD_TYPE" = "both" ]; then
            flutter build appbundle --release "${DART_DEFINES[@]}"
          fi

          echo "=== Built APK Sizes ==="
          ls -lh build/app/outputs/release-artifacts/ || true
          {
            echo "## ZuLive Android Build Output"
            echo ""
            for f in build/app/outputs/release-artifacts/*.apk; do
              [ -f "$f" ] || continue
              SIZE_MB=$(du -m "$f" | cut -f1)
              echo "- **$(basename "$f")**: ${SIZE_MB} MB"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print APK Signing SHA-1 Fingerprint
        if: ${{ (github.event.inputs.build_type || 'apk') != 'appbundle' }}
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK_FILE=$(ls build/app/outputs/release-artifacts/*.apk | head -n 1)
          echo "=== Signing Certificate Fingerprints (Add SHA-1 to Firebase Console) ==="
          if [ -f android/app/release-keystore.jks ]; then
            keytool -list -v -keystore android/app/release-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true
          elif [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          fi
          if [ -n "$APK_FILE" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$APK_FILE" || true
            fi
          fi

      - name: Upload arm64-v8a APK (Most Modern Phones - Recommended)
        if: ${{ (github.event.inputs.build_type || 'apk') != 'appbundle' && github.event.inputs.split_per_abi != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: zulive-apk-arm64-most-phones
          path: flutter_app/build/app/outputs/release-artifacts/ZuLive-arm64-v8a.apk
          retention-days: 30

      - name: Upload armeabi-v7a APK (Older 32-bit Phones)
        if: ${{ (github.event.inputs.build_type || 'apk') != 'appbundle' && github.event.inputs.split_per_abi != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: zulive-apk-armv7-older-phones
          path: flutter_app/build/app/outputs/release-artifacts/ZuLive-armeabi-v7a.apk
          retention-days: 30

      - name: Upload Universal APK artifact
        if: ${{ (github.event.inputs.build_type || 'apk') != 'appbundle' && github.event.inputs.split_per_abi == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: zulive-android-apk
          path: flutter_app/build/app/outputs/release-artifacts/ZuLive-universal.apk
          retention-days: 30

      - name: Upload App Bundle (.aab) artifact
        if: ${{ github.event.inputs.build_type == 'appbundle' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: zulive-android-aab
          path: flutter_app/build/app/outputs/bundle/release/*.aab
          retention-days: 30
